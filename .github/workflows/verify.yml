name: Verify RV32I

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: |
          verilator --lint-only -Wall --top-module rv32i_core rtl/*.sv
          verilator --lint-only -Wall --top-module rv32i_single_cycle rtl/*.sv
      - name: Regression
        run: |
          mkdir -p build/evidence
          python3 tb/run.py --random 100 | tee build/evidence/pipeline-coverage.txt
          python3 tb/run.py --single-cycle --random 100 | tee build/evidence/single-cycle-coverage.txt
      - name: Synthesize
        run: yosys -Q -T -l build/evidence/synthesis.log -s scripts/synth.ys
      - name: Prove pipeline and trap properties
        working-directory: formal
        run: sby -f core.sby
      - name: Retain regression and proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32i-rtl-evidence
          path: |
            build/evidence/
            formal/core/logfile.txt
          if-no-files-found: ignore
